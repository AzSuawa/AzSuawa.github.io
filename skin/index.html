<script>
// ============================================================
// 皮肤上传 + Captcha 验证前端
// 对接新接口：
//   POST /v2/skin_lib/upload       上传皮肤（multipart）
//   POST /v2/captcha/              拿题 / 判题（JSON body）
// 身份传递：
//   Authorization: Bearer <temp_token>
// 上传探测：
//   GetCaptcha: true               匿名时声明"愿意做验证"
// ============================================================

// ---------- API 基址（按你的部署改） ----------
const API_BASE = "https://api.azsu.top";

// ---------- DOM 引用（保持你原有变量名） ----------
const dropArea = document.getElementById("dropArea"),
      fileInput = document.getElementById("fileInput"),
      selectBtn = document.getElementById("selectBtn"),
      progressContainer = document.getElementById("progressContainer"),
      uploadProgress = document.getElementById("uploadProgress"),
      statusText = document.getElementById("statusText"),
      fileList = document.getElementById("fileList"),
      playerIdInput = document.getElementById("playerId"),
      captchaOverlay = document.getElementById("captchaOverlay"),
      captchaCard = document.getElementById("captchaCard"),
      captchaGridOverlay = document.getElementById("captchaGridOverlay"),
      captchaSubmitBtn = document.getElementById("captchaSubmitBtn"),
      captchaCancelBtn = document.getElementById("captchaCancelBtn"),
      captchaCloseBtn = document.getElementById("captchaCloseBtn"),
      captchaImage = document.getElementById("captchaImage"),
      cuewordElement = document.getElementById("cueword"),
      captchaCenterMessage = document.getElementById("captchaCenterMessage"),
      captchaSuccessMessage = document.getElementById("captchaSuccessMessage"),
      captchaErrorMessage = document.getElementById("captchaErrorMessage"),
      captchaErrorText = document.getElementById("captchaErrorText");

// ---------- 全局状态 ----------
let selectedCells = [];
let tempToken = "";              // 后端签发的临时令牌
let verificationInProgress = false;
let pendingFiles = null;
let pendingPlayerId = "";

// ============================================================
// 工具函数
// ============================================================
function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
}

function formatFileSize(bytes) {
    if (bytes === 0) return "0 Bytes";
    const k = 1024;
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + ["Bytes", "KB", "MB", "GB"][i];
}

function showError(msg) {
    statusText.textContent = msg;
    statusText.style.color = "#dc3545";
    progressContainer.style.display = "block";
}

function updateFileStatus(item, text, status) {
    const el = item.querySelector(".skin-file-status");
    el.textContent = text;
    el.className = `skin-file-status skin-status-${status}`;
}

function addPreviewLink(item, playerId) {
    const a = document.createElement("a");
    a.href = `${API_BASE}/v2/skin_lib/file?player=${encodeURIComponent(playerId)}`;
    a.textContent = "查看皮肤";
    a.className = "skin-preview-link";
    a.target = "_blank";
    item.appendChild(a);
}

// ============================================================
// temp_token 本地存储
// ============================================================
function storeTempToken(token) {
    tempToken = token;
    localStorage.setItem("skin_temp_token", token);
}

function loadTempToken() {
    tempToken = localStorage.getItem("skin_temp_token") || "";
    return tempToken;
}

function clearTempToken() {
    tempToken = "";
    localStorage.removeItem("skin_temp_token");
}

// ============================================================
// 文件选择 / 拖放
// ============================================================
function handleDrop(e) {
    const files = e.dataTransfer.files;
    handleFiles(files);
}

function handleFiles(files) {
    fileList.innerHTML = "";
    pendingFiles = null;
    pendingPlayerId = "";

    const playerId = playerIdInput.value.trim();
    if (!playerId) {
        showError("请先输入玩家ID(p≧w≦q)");
        fileInput.value = "";
        return;
    }

    const pngFiles = Array.from(files).filter(f => f.type === "image/png");
    if (pngFiles.length === 0) {
        showError("请选择PNG格式的皮肤文件(p≧w≦q)");
        fileInput.value = "";
        return;
    }

    const oversize = pngFiles.filter(f => f.size > 10240);
    if (oversize.length > 0) {
        showError(`文件 "${oversize[0].name}" 超过10KB限制(p≧w≦q)`);
        fileInput.value = "";
        return;
    }

    const file = pngFiles[0];
    const img = new Image();
    img.onload = function () {
        if (this.width !== 64 || this.height !== 64) {
            showError("皮肤图片尺寸必须是64x64像素(p≧w≦q)");
            fileInput.value = "";
            return;
        }

        // 展示文件条目
        const item = document.createElement("div");
        item.className = "skin-file-item";
        item.innerHTML = `
            <div class="skin-file-info">
                <span class="skin-file-icon">📄</span>
                <span>${file.name} (${formatFileSize(file.size)})</span>
            </div>
            <span class="skin-file-status skin-status-pending">准备上传</span>
        `;
        fileList.appendChild(item);

        pendingFiles = pngFiles;
        pendingPlayerId = playerId;

        // 直接尝试上传（带本地 temp_token，如果有）
        attemptUpload();
    };
    img.onerror = function () {
        showError("无法读取图片文件(p≧w≦q)");
        fileInput.value = "";
    };
    img.src = URL.createObjectURL(file);
}

// ============================================================
// 上传（探测 + 正式）
// ============================================================
function attemptUpload() {
    const file = pendingFiles[0];
    const playerId = pendingPlayerId;

    progressContainer.style.display = "block";
    statusText.textContent = "准备上传...";
    statusText.style.color = "";
    uploadProgress.value = 0;

    const formData = new FormData();
    formData.append("file", file);
    formData.append("player_id", playerId);

    const headers = {};
    if (tempToken) {
        headers["Authorization"] = `Bearer ${tempToken}`;
    } else {
        // 匿名时声明"我愿意做验证"，让后端返回 14106 + temp_token
        headers["GetCaptcha"] = "true";
    }

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${API_BASE}/v2/skin_lib/upload`, true);
    for (const [k, v] of Object.entries(headers)) {
        xhr.setRequestHeader(k, v);
    }

    xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
            const percent = Math.round(e.loaded / e.total * 100);
            uploadProgress.value = percent;
            statusText.textContent = `上传中: ${percent}%`;
        }
    };

    xhr.onload = function () {
        let resp = null;
        try {
            resp = JSON.parse(xhr.responseText);
        } catch (e) {
            resp = null;
        }

        if (!resp) {
            statusText.textContent = "服务器响应异常";
            statusText.style.color = "#dc3545";
            return;
        }

        // ---------- 成功 ----------
        if (resp.code === 14000) {
            statusText.textContent = "文件上传成功(p≧w≦q)";
            statusText.style.color = "#28a745";
            uploadProgress.value = 100;
            const item = document.querySelector(".skin-file-item");
            updateFileStatus(item, "上传成功", "success");
            addPreviewLink(item, playerId);
            // 上传成功后清掉 temp_token（一次性）
            clearTempToken();
            fileInput.value = "";
            pendingFiles = null;
            pendingPlayerId = "";
            return;
        }

        // ---------- 需要 captcha ----------
        if (resp.code === 14106) {
            const newToken = resp.data && resp.data.temp_token;
            if (!newToken) {
                showError("服务器未返回验证令牌");
                return;
            }
            storeTempToken(newToken);
            statusText.textContent = "需要人机验证...";
            statusText.style.color = "#ffc107";
            // 弹验证卡片
            showCaptcha();
            initVerification();
            return;
        }

        // ---------- 401 / 403 / 其他 ----------
        const msg = resp.message || "上传失败";
        statusText.textContent = msg;
        statusText.style.color = "#dc3545";
        const item = document.querySelector(".skin-file-item");
        if (item) updateFileStatus(item, msg, "error");

        // 401 且没带 GetCaptcha → 清掉本地 token 重试一次
        if (resp.code === 401 && tempToken) {
            clearTempToken();
            statusText.textContent = "登录已过期，请重试";
        }
    };

    xhr.onerror = function () {
        statusText.textContent = "网络错误，上传失败(p≧w≦q)";
        statusText.style.color = "#dc3545";
        const item = document.querySelector(".skin-file-item");
        if (item) updateFileStatus(item, "网络错误", "error");
    };

    xhr.send(formData);
}

// ============================================================
// Captcha 验证
// ============================================================
function showCaptcha() {
    captchaCard.style.display = "block";
    captchaOverlay.style.display = "block";
}

function hideCaptcha() {
    captchaCard.style.display = "none";
    captchaOverlay.style.display = "none";
}

function setCaptchaLoading(loading) {
    if (loading) {
        captchaCard.classList.add("captcha-loading");
    } else {
        captchaCard.classList.remove("captcha-loading");
    }
    verificationInProgress = loading;
}

function updateCenterMessage(msg) {
    captchaCenterMessage.textContent = msg;
}

function hideCenterMessage() {
    captchaCenterMessage.textContent = "";
}

function showCaptchaSuccess() {
    captchaSuccessMessage.style.display = "block";
    setTimeout(() => { captchaSuccessMessage.style.display = "none"; }, 1000);
}

function showCaptchaError(msg) {
    captchaErrorText.textContent = msg;
    captchaErrorMessage.style.display = "block";
    setTimeout(() => { captchaErrorMessage.style.display = "none"; }, 3000);
}

function resetCaptchaSelection() {
    selectedCells = [];
    document.querySelectorAll(".captcha-grid-cell.selected").forEach(el => {
        el.classList.remove("selected");
    });
    captchaSubmitBtn.disabled = true;
}

// ---------- 拿题（首次） ----------
async function initVerification() {
    if (!tempToken) {
        showCaptchaError("缺少验证令牌");
        hideCaptcha();
        return;
    }
    setCaptchaLoading(true);
    updateCenterMessage("正在加载验证图片...");
    clearCaptchaSelection();
    await requestCaptcha(null);
}

// 清空选择（保留你原来 resetCaptchaSelection 的语义）
function clearCaptchaSelection() {
    resetCaptchaSelection();
}

// ---------- 提交答案 / 拿新题 ----------
async function submitCaptcha() {
    if (verificationInProgress) return;
    if (selectedCells.length === 0) return;

    setCaptchaLoading(true);
    captchaSubmitBtn.disabled = true;
    updateCenterMessage("正在验证...");

    await requestCaptcha(selectedCells);
}

// ---------- 统一请求 captcha 接口 ----------
async function requestCaptcha(cells) {
    const body = cells === null ? {} : { selected_cells: cells };

    try {
        const resp = await fetch(`${API_BASE}/v2/captcha/`, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${tempToken}`,
                "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
        });

        // 状态在 header 里
        const code = resp.headers.get("X-Code");
        const status = resp.headers.get("X-Captcha-Status");
        const message = resp.headers.get("X-Message") || "";
        const cuewordEncoded = resp.headers.get("X-Captcha-Cueword") || "";

        // 成功 / 失败 / processing
        if (status === "success") {
            hideCaptcha();
            setTimeout(() => {
                showCaptchaSuccess();
                setTimeout(() => {
                    resetCaptchaSelection();
                    setCaptchaLoading(false);
                    // 验证成功 → 重新上传
                    attemptUpload();
                }, 1000);
            }, 10);
            return;
        }

        if (status === "failed") {
            showCaptchaError("验证失败: " + message);
            setCaptchaLoading(false);
            hideCaptcha();
            // 失败后 temp_token 已被后端删除，清掉本地的
            clearTempToken();
            return;
        }

        // processing → 拿新题
        const blob = await resp.blob();
        if (blob && blob.size > 0) {
            captchaImage.src = URL.createObjectURL(blob);
            captchaImage.style.display = "block";
            hideCenterMessage();
        }
        if (cuewordEncoded) {
            cuewordElement.textContent = decodeURIComponent(cuewordEncoded);
        }
        resetCaptchaSelection();
        setCaptchaLoading(false);

    } catch (e) {
        showCaptchaError("验证请求失败: " + e.message);
        setCaptchaLoading(false);
    }
}

function cancelCaptcha() {
    hideCaptcha();
    resetCaptchaSelection();
    clearTempToken();
    pendingFiles = null;
    pendingPlayerId = "";
    fileList.innerHTML = "";
    statusText.textContent = "已取消验证";
    statusText.style.color = "#999";
}

// ============================================================
// 事件绑定
// ============================================================
selectBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => handleFiles(fileInput.files));

["dragenter", "dragover", "dragleave", "drop"].forEach(evt => {
    dropArea.addEventListener(evt, preventDefaults, false);
});
["dragenter", "dragover"].forEach(evt => {
    dropArea.addEventListener(evt, () => dropArea.classList.add("highlight"), false);
});
["dragleave", "drop"].forEach(evt => {
    dropArea.addEventListener(evt, () => dropArea.classList.remove("highlight"), false);
});
dropArea.addEventListener("drop", handleDrop, false);

captchaSubmitBtn.addEventListener("click", submitCaptcha);
captchaCancelBtn.addEventListener("click", cancelCaptcha);
captchaCloseBtn.addEventListener("click", cancelCaptcha);

// 生成 16 个格子
for (let i = 0; i < 16; i++) {
    const cell = document.createElement("div");
    cell.className = "captcha-grid-cell";
    cell.dataset.index = i;
    cell.addEventListener("click", function () {
        if (verificationInProgress) return;
        this.classList.toggle("selected");
        const idx = parseInt(this.dataset.index);
        if (this.classList.contains("selected")) {
            if (!selectedCells.includes(idx)) selectedCells.push(idx);
        } else {
            selectedCells = selectedCells.filter(x => x !== idx);
        }
        captchaSubmitBtn.disabled = selectedCells.length === 0;
    });
    captchaGridOverlay.appendChild(cell);
}

// ============================================================
// 页面初始化：加载本地 temp_token
// ============================================================
loadTempToken();
</script>
